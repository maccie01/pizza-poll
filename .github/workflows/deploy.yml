name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject API key
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_API_KEY }}
        shell: python3 {0}
        run: |
          import os
          key = os.environ.get('JSONBIN_KEY', '')
          if not key:
              raise ValueError('JSONBIN_API_KEY secret is not set')
          with open('index.html', 'r') as f:
              content = f.read()
          assert '__JSONBIN_API_KEY__' in content, 'Placeholder not found in index.html'
          content = content.replace('__JSONBIN_API_KEY__', key)
          assert '__JSONBIN_API_KEY__' not in content, 'Replacement failed'
          with open('index.html', 'w') as f:
              f.write(content)
          print('API key injected successfully')

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
